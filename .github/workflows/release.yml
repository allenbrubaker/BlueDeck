name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (must match versionName, e.g. v1.14.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/prepare_release.py

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing repository secret: $secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/bluedeck-release.keystore
        run: |
          umask 077
          # Strip whitespace; tolerate wrapped base64 from Windows paste.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 -d > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty — KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/bluedeck-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets and notes
        id: prepare
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Expected APK not found at $APK_SRC"
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_SRC" "BlueDeck-${VERSION}.apk"
          echo "apk=BlueDeck-${VERSION}.apk" >> "$GITHUB_OUTPUT"

          awk -v ver="$VERSION" '
            index($0, "## [" ver "] - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section for [$VERSION]; using generated notes only." > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_APK: ${{ steps.prepare.outputs.apk }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "BlueDeck $RELEASE_TAG" \
            --notes-file release_notes.md \
            --generate-notes

      - name: Remove temporary signing key
        if: always()
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/bluedeck-release.keystore
        run: rm -f -- "$KEYSTORE_FILE"
